<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA SALVAGE</title>
<meta name="description" content="NOVA SALVAGE: an original 2D canvas arcade game. Blast rocks, collect star-cores, clear 8 waves, break the Derelict Hulk.">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #070b16;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="NOVA SALVAGE: pilot a salvage tug, blast asteroids and collect star-cores"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
